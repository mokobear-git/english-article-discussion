# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: english-article-discussion
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MODEL
        value: claude-haiku-5-5
